<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Backyard Flight HUD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Capture resource load 404s and module execution crashes
    window.addEventListener('error', function(e) {
      const status = document.getElementById('board-status');
      if (status) {
        const src = e.target && e.target.src ? e.target.src.split('/').pop() : 'script';
        status.innerText = 'SCRIPT LOAD 404: Could not load ' + src;
        status.className = 'text-center py-12 text-red-400 font-mono text-xs px-4';
      }
    }, true);
  </script>
  <style>
    .card-enter { animation: fadeIn 300ms cubic-bezier(0.2, 0, 0, 1) forwards; }
    .card-exit { animation: fadeOut 300ms cubic-bezier(0.2, 0, 0, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(8px); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4 pb-[calc(2rem+env(safe-area-inset-bottom))]">
  <main class="max-w-md mx-auto space-y-4">
    <!-- Header & Scoreboard -->
    <header class="flex items-center justify-between p-4 rounded-xl bg-slate-900 border border-slate-800 shadow-md">
      <div>
        <h1 class="text-base font-black text-cyan-400 tracking-wider">BACKYARD HUD</h1>
        <p class="text-[10px] text-slate-400 font-mono">LEWISVILLE, TX (75067)</p>
      </div>
      <div class="flex gap-3 text-right font-mono">
        <div>
          <div id="score-today" class="text-sm font-bold text-amber-400">0</div>
          <div class="text-[8px] text-slate-500 uppercase">TODAY</div>
        </div>
        <div>
          <div id="score-lifetime" class="text-sm font-bold text-cyan-400">0</div>
          <div class="text-[8px] text-slate-500 uppercase">TOTAL</div>
        </div>
      </div>
    </header>

    <!-- Status Message -->
    <div id="board-status" class="text-center py-12 text-slate-500 font-mono text-xs">
      Scanning local airspace above 10° elevation...
    </div>

    <!-- Active Flight Cards Container -->
    <div id="flight-cards-container" class="space-y-3"></div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
